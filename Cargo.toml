[package]
name = "yawl"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.0"
description = "A minimal, self-extending AI agent harness"
license = "MIT"
repository = "https://github.com/alan13367/yawl"
exclude = ["Assets/"]

[dependencies]
base64 = "0.23"
ureq = { version = "3", features = ["charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = { version = "0.27", default-features = false }
unicode-width = { version = "0.2", default-features = false }
unicode-segmentation = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Already in the dependency tree through ring, so this adds no crates.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
